<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Three-panel island wave story prompt</title>
  <desc id="desc">An original island girl sees trouble near a reef, rescues a turtle and canoe with teamwork, then returns to shore with fish.</desc>
